<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Desk</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #2f5d50; --accent-ink: #ffffff; --warn: #9a5b13; --bad: #a33a2b; --good: #2f6b3a;
    --chip: #eeece5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e;
      --accent: #7fb8a4; --accent-ink: #10201b; --warn: #e0a95c; --bad: #e88a7b; --good: #8fcf98;
      --chip: #2a2a26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); }
  nav button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
                            background: var(--bg); color: var(--ink); font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; padding: 8px 14px; border-radius: 6px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  pre.draft { white-space: pre-wrap; font: inherit; margin: 0; }
  .jobs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .jobs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 99px; }
  .jobs button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; max-width: 90vw; }
  .login { max-width: 360px; margin: 10vh auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { token: sessionStorage.getItem("token"), user: null, tab: "jobs", jobId: null };

function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms); }

async function api(path, opts = {}) {
  const headers = opts.body instanceof FormData ? {} : { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  const res = await fetch(path, { ...opts, headers,
    body: opts.body instanceof FormData ? opts.body : opts.body && JSON.stringify(opts.body) });
  if (res.status === 401 && path !== "/auth/login") { logout(); throw new Error("Session expired, sign in again"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data));
  return data;
}
async function busy(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, 6000); } finally { btn.disabled = false; } }
function logout() { state.token = null; state.user = null; sessionStorage.removeItem("token"); render(); }

// ---------- login ----------
function loginView() {
  $("#app").innerHTML = `<div class="panel login"><h2>Hiring Desk</h2>
    <p class="muted">AI agents do the drafting and screening. You make every decision.</p>
    <form id="lf"><label>Email</label><input name="email" type="email" required autofocus>
    <label>Password</label><input name="password" type="password" required>
    <div style="margin-top:14px"><button class="btn">Sign in</button></div></form></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    try { const r = await api("/auth/login", { method: "POST", body: { email: f.get("email"), password: f.get("password") } });
      state.token = r.access_token; state.user = r.user; sessionStorage.setItem("token", r.access_token);
      state.tab = r.user.role === "hr_admin" ? "jobs" : "mine"; render();
    } catch (err) { toast(err.message); } };
}

// ---------- shell ----------
const HR_TABS = [["jobs","Jobs & candidates"],["interviews","Interviews"],["drafts","Drafts to review"],["activity","Agent activity"],["team","Team"]];
const IV_TABS = [["mine","My interviews"]];
async function render() {
  if (!state.token) return loginView();
  if (!state.user) { try { state.user = await api("/auth/me"); } catch { return; } }
  const tabs = state.user.role === "hr_admin" ? HR_TABS : IV_TABS;
  $("#app").innerHTML = `<header><h1>Hiring Desk</h1><nav>${tabs.map(([k,l]) =>
    `<button data-tab="${k}" class="${state.tab===k?"on":""}">${l}</button>`).join("")}</nav>
    <span class="who">${esc(state.user.name)} · ${esc(state.user.role.replace("_"," "))}
    · <a href="#" id="lo">sign out</a></span></header><main id="main"></main>`;
  $("#lo").onclick = e => { e.preventDefault(); logout(); };
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const views = { jobs: jobsView, interviews: interviewsView, drafts: draftsView, activity: activityView, team: teamView, mine: mineView };
  try { await views[state.tab](); } catch (e) { $("#main").innerHTML = `<div class="panel bad">${esc(e.message)}</div>`; }
}

// ---------- jobs & candidates ----------
async function jobsView() {
  const jobs = await api("/jobs");
  if (!state.jobId && jobs.length) state.jobId = jobs[0].id;
  const job = jobs.find(j => j.id === state.jobId);
  $("#main").innerHTML = `
    <div class="jobs">${jobs.map(j => `<button data-j="${j.id}" class="${j.id===state.jobId?"on":""}">${esc(j.title)}</button>`).join("")}
      <button id="newjob">+ New job</button></div>
    <div id="newjobp" class="panel ${jobs.length ? "hidden" : ""}"><h2>New job</h2>
      <form id="jf"><div class="grid2"><div><label>Title</label><input name="title" required></div>
      <div><label>Department</label><input name="department"></div></div>
      <label>Must-have requirements (the screening agent scores against these)</label>
      <textarea name="requirements" required placeholder="e.g. Python, FastAPI, Docker, 3+ years building APIs"></textarea>
      <label>Salary band (confidential: only the writing agent sees it, for offers)</label><input name="salary_band">
      <div style="margin-top:12px"><button class="btn">Create job</button></div></form></div>
    <div id="jobp"></div>`;
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { state.jobId = +b.dataset.j; render(); });
  $("#newjob").onclick = () => $("#newjobp").classList.toggle("hidden");
  $("#jf").onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try { const j = await api("/jobs", { method: "POST", body: f }); state.jobId = j.id; toast("Job created"); render(); } catch (err) { toast(err.message); } };
  if (job) await jobPanel(job);
}

async function jobPanel(job) {
  const [cands, users] = await Promise.all([api(`/jobs/${job.id}/candidates`), api("/users")]);
  const ivs = users.filter(u => u.is_active);
  $("#jobp").innerHTML = `
    <div class="panel"><div class="row"><h2 style="margin:0">${esc(job.title)}</h2>
      <span class="chip">${esc(job.department || "No department")}</span>
      <span class="muted" style="margin-left:auto">Salary band: ${esc(job.salary_band || "not set")}</span></div>
      <h3>Requirements</h3><div class="muted">${esc(job.requirements)}</div>
      <h3>Job description</h3>${job.description ? `<pre class="draft">${esc(job.description)}</pre>` : `<p class="muted">None yet.</p>`}
      <div class="row" style="margin-top:12px"><button class="btn ghost small" id="jd">✍️ Writing agent: draft job description</button></div></div>
    <div class="panel"><div class="row"><h2 style="margin:0">Candidates (${cands.length})</h2>
      <button class="btn small" id="screen" style="margin-left:auto">🔎 Screening agent: screen new resumes</button></div>
      <form id="up" class="row" style="margin:12px 0"><input type="file" name="files" multiple accept=".txt,.md,.pdf" style="flex:1">
        <button class="btn ghost small">Upload resumes</button></form>
      ${cands.length ? `<table><tr><th>Score</th><th>Candidate</th><th>Why</th><th>Status</th><th></th></tr>
      ${cands.map(c => `<tr><td class="score">${c.score ?? "–"}</td>
        <td><b>${esc(c.name)}</b><div class="muted">${esc(c.email)}</div></td>
        <td>${c.screening ? `${esc(c.screening.summary)}
          ${c.screening.strengths?.length ? `<div class="ok muted">+ ${c.screening.strengths.map(esc).join(", ")}</div>` : ""}
          ${c.screening.gaps?.length ? `<div class="warn muted">− ${c.screening.gaps.map(esc).join(", ")}</div>` : ""}` : `<span class="muted">Not screened</span>`}
          ${c.feedback_summary ? `<details><summary>Interview feedback summary</summary><pre class="draft">${esc(c.feedback_summary)}</pre></details>` : ""}
          <details><summary>Resume</summary><pre class="draft muted">${esc(c.resume_text)}</pre></details></td>
        <td><select data-st="${c.id}">${["new","screened","shortlisted","interviewing","offered","rejected"].map(s =>
          `<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></td>
        <td><div class="row" style="flex-direction:column;align-items:stretch">
          <button class="btn ghost small" data-sched="${c.id}">📅 Schedule</button>
          <button class="btn ghost small" data-sum="${c.id}">🧾 Summarise feedback</button>
          <button class="btn ghost small" data-offer="${c.id}">📄 Draft offer</button>
          <button class="btn ghost small" data-rej="${c.id}">✉️ Draft rejection</button></div>
          <form class="hidden panel" data-sf="${c.id}" style="margin-top:8px;padding:10px">
            <label>Interviewer</label><select name="iv">${ivs.map(u => `<option value="${u.id}">${esc(u.name)} (${u.role.replace("_"," ")})</option>`).join("")}</select>
            <label>Slots to offer</label><input type="datetime-local" name="s1" required><input type="datetime-local" name="s2"><input type="datetime-local" name="s3">
            <button class="btn small" style="margin-top:8px">Propose & draft invite</button></form></td></tr>`).join("")}</table>`
      : `<p class="muted">No candidates yet. Upload .txt or .pdf resumes (try the files in sample_data/).</p>`}</div>`;

  const agent = (path, body, msg) => async () => { const r = await api(path, { method: "POST", body }); toast(msg || r.summary); render(); };
  $("#jd").onclick = e => busy(e.target, agent("/agents/writing/job_description", { job_id: job.id }, "Draft ready in 'Drafts to review'"));
  $("#screen").onclick = e => busy(e.target, agent("/agents/screening/screen", { job_id: job.id }));
  $("#up").onsubmit = e => { e.preventDefault(); const btn = $("button", e.target);
    busy(btn, async () => { const r = await api(`/jobs/${job.id}/candidates/upload`, { method: "POST", body: new FormData(e.target) });
      toast(`Added ${r.created.length}` + (r.skipped.length ? `, skipped ${r.skipped.length}: ${r.skipped.map(s => s.file + " (" + s.reason + ")").join("; ")}` : ""), 6000); render(); }); };
  document.querySelectorAll("[data-st]").forEach(s => s.onchange = async () => {
    try { await api(`/candidates/${s.dataset.st}/status`, { method: "POST", body: { status: s.value } }); toast("Status updated"); } catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-offer]").forEach(b => b.onclick = () => busy(b, agent("/agents/writing/offer", { candidate_id: +b.dataset.offer }, "Offer draft ready in 'Drafts to review'")));
  document.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => busy(b, agent("/agents/writing/rejection", { candidate_id: +b.dataset.rej }, "Rejection draft ready in 'Drafts to review'")));
  document.querySelectorAll("[data-sum]").forEach(b => b.onclick = () => busy(b, agent("/agents/feedback/summarize", { candidate_id: +b.dataset.sum })));
  document.querySelectorAll("[data-sched]").forEach(b => b.onclick = () => $(`[data-sf="${b.dataset.sched}"]`).classList.toggle("hidden"));
  document.querySelectorAll("[data-sf]").forEach(f => f.onsubmit = e => { e.preventDefault(); const d = new FormData(f);
    const slots = ["s1","s2","s3"].map(k => d.get(k)).filter(Boolean);
    busy($("button", f), agent("/agents/scheduling/propose", { candidate_id: +f.dataset.sf, interviewer_id: +d.get("iv"), slots }, "Interview proposed. Invite draft is in 'Drafts to review'")); });
}

// ---------- interviews ----------
async function interviewsView() {
  const rows = await api("/interviews");
  $("#main").innerHTML = `<div class="panel"><div class="row"><h2 style="margin:0">Interviews</h2>
    <button class="btn small" id="chase" style="margin-left:auto">🔔 Feedback agent: chase missing feedback</button></div>
    ${rows.length ? `<table><tr><th>Candidate</th><th>Job</th><th>Interviewer</th><th>When</th><th>Feedback</th><th></th></tr>
    ${rows.map(i => `<tr><td>${esc(i.candidate.name)}</td><td>${esc(i.job.title)}</td><td>${esc(i.interviewer.name)}</td>
      <td>${i.scheduled_at ? esc(i.scheduled_at.replace("T"," ")) : `<span class="chip">proposed</span>
        <form class="row" data-cf="${i.id}" style="margin-top:6px"><select name="slot">${i.proposed_slots.map(s => `<option>${esc(s)}</option>`).join("")}</select>
        <button class="btn ghost small">Confirm slot</button></form>`}</td>
      <td>${i.feedback ? `<b>${i.feedback.rating}/5</b> <span class="muted">${esc(i.feedback.notes)}</span>` : `<span class="muted">waiting</span>`}</td>
      <td><button class="btn ghost small" data-kit="${i.id}">🧩 Interview kit</button></td></tr>`).join("")}</table>`
    : `<p class="muted">No interviews yet. Schedule one from a candidate row.</p>`}</div>`;
  $("#chase").onclick = e => busy(e.target, async () => { const r = await api("/agents/feedback/chase", { method: "POST", body: {} }); toast(r.summary + (r.drafts.length ? ". Reminders are in 'Drafts to review'" : "")); });
  document.querySelectorAll("[data-cf]").forEach(f => f.onsubmit = e => { e.preventDefault();
    busy($("button", f), async () => { await api(`/interviews/${f.dataset.cf}/confirm`, { method: "POST", body: { slot: new FormData(f).get("slot") } }); toast("Slot confirmed"); render(); }); });
  document.querySelectorAll("[data-kit]").forEach(b => b.onclick = () => busy(b, async () => {
    const r = await api("/agents/interview_kit/prepare", { method: "POST", body: { interview_id: +b.dataset.kit } });
    toast(r.summary + ". Kit draft is in 'Drafts to review'");
    render();
  }));
}

// ---------- drafts ----------
async function draftsView() {
  const drafts = await api("/drafts?status=pending");
  $("#main").innerHTML = `<div class="panel"><h2>Drafts to review (${drafts.length})</h2>
    <p class="muted">Agents never send anything. Edit, approve, then copy and send it yourself.</p></div>
    ${drafts.map(d => `<div class="panel" data-d="${d.id}"><div class="row"><span class="chip">${esc(d.kind.replace("_"," "))}</span>
      <span class="muted">by ${esc(d.agent)} agent${d.recipient ? " · to " + esc(d.recipient) : ""}</span></div>
      <label>Subject</label><input name="subject" value="${esc(d.subject)}">
      <label>Content</label><textarea name="content" style="min-height:200px">${esc(d.content)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn small" data-a="approve">Approve</button>
      <button class="btn ghost small" data-a="copy">Copy</button><button class="btn ghost small" data-a="discard">Discard</button></div></div>`).join("")
    || `<div class="panel muted">Nothing waiting for you.</div>`}`;
  document.querySelectorAll("[data-d]").forEach(p => p.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const id = p.dataset.d, content = $("[name=content]", p).value, subject = $("[name=subject]", p).value;
    if (b.dataset.a === "copy") return navigator.clipboard.writeText(subject + "\n\n" + content).then(() => toast("Copied"));
    busy(b, async () => { await api(`/drafts/${id}/${b.dataset.a}`, { method: "POST", body: b.dataset.a === "approve" ? { content, subject } : {} });
      toast(b.dataset.a === "approve" ? "Approved" : "Discarded"); render(); }); }));
}

// ---------- activity ----------
async function activityView() {
  const [runs, agents] = await Promise.all([api("/agent-runs"), api("/agents")]);
  $("#main").innerHTML = `<div class="panel"><h2>What each agent is allowed to touch</h2><table>
    <tr><th>Agent</th><th>Does</th><th>Scopes</th></tr>${agents.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.description)}</td>
    <td>${a.scopes.map(s => `<span class="chip" title="${esc(s.meaning)}">${esc(s.scope)}</span>`).join(" ")}</td></tr>`).join("")}</table></div>
    <div class="panel"><h2>Agent activity log</h2><p class="muted">Every agent run, including denied and failed ones. Full traces are in AgentOps when it's configured.</p>
    ${runs.length ? `<table><tr><th>When</th><th>Agent</th><th>By</th><th>Result</th><th>Scopes used</th><th>ms</th></tr>
    ${runs.map(r => `<tr><td class="muted">${esc(r.created_at.replace("T"," "))}</td><td>${esc(r.agent)}.${esc(r.action)}</td><td>${esc(r.user)}</td>
      <td class="${r.status==="success"?"ok":"bad"}">${esc(r.status)}<div class="muted">${esc(r.summary || r.error)}</div></td>
      <td>${r.scopes_used.map(s => `<span class="chip">${esc(s)}</span>`).join(" ")}</td><td class="muted">${r.duration_ms}</td></tr>`).join("")}</table>`
    : `<p class="muted">No agent runs yet.</p>`}</div>`;
}

// ---------- team ----------
async function teamView() {
  const users = await api("/users");
  $("#main").innerHTML = `<div class="panel"><h2>Team</h2><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
    ${users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="chip">${esc(u.role.replace("_"," "))}</span></td>
    <td>${u.is_active ? (u.id === state.user.id ? "" : `<button class="btn ghost small" data-off="${u.id}">Deactivate</button>`) : `<span class="muted">deactivated</span>`}</td></tr>`).join("")}</table></div>
    <div class="panel"><h2>Add a person</h2><form id="uf"><div class="grid2">
      <div><label>Name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div>
      <div><label>Temporary password (8+ characters)</label><input name="password" minlength="8" required></div>
      <div><label>Role</label><select name="role"><option value="interviewer">interviewer</option><option value="hr_admin">hr admin</option></select></div></div>
      <div style="margin-top:12px"><button class="btn">Add</button></div></form></div>`;
  $("#uf").onsubmit = async e => { e.preventDefault();
    try { await api("/users", { method: "POST", body: Object.fromEntries(new FormData(e.target)) }); toast("Added"); render(); } catch (err) { toast(err.message); } };
  document.querySelectorAll("[data-off]").forEach(b => b.onclick = () => busy(b, async () => { await api(`/users/${b.dataset.off}/deactivate`, { method: "POST" }); render(); }));
}

// ---------- interviewer ----------
async function mineView() {
  const rows = await api("/my/interviews");
  $("#main").innerHTML = rows.map(i => `<div class="panel"><div class="row"><h2 style="margin:0">${esc(i.candidate.name)}</h2>
      <span class="chip">${esc(i.job.title)}</span><span class="muted" style="margin-left:auto">${i.scheduled_at ? esc(i.scheduled_at.replace("T"," ")) : "time not confirmed yet"}</span></div>
      <details style="margin-top:8px" data-res="${i.candidate.id}"><summary>Resume</summary><pre class="draft muted">Loading…</pre></details>
      ${i.feedback ? `<p><b>Your feedback:</b> ${i.feedback.rating}/5 · ${esc(i.feedback.notes)}</p>`
      : i.scheduled_at ? `<form data-fb="${i.id}"><label>Rating</label><select name="rating">${[5,4,3,2,1].map(n => `<option>${n}</option>`).join("")}</select>
        <label>Notes</label><textarea name="notes" required></textarea><div style="margin-top:10px"><button class="btn small">Submit feedback</button></div></form>` : ""}</div>`).join("")
    || `<div class="panel muted">No interviews assigned to you yet.</div>`;
  document.querySelectorAll("[data-res]").forEach(d => d.addEventListener("toggle", async () => {
    if (!d.open || d._loaded) return; d._loaded = true;
    try { $("pre", d).textContent = (await api(`/candidates/${d.dataset.res}`)).resume_text; } catch (e) { $("pre", d).textContent = e.message; } }));
  document.querySelectorAll("[data-fb]").forEach(f => f.onsubmit = e => { e.preventDefault(); const d = new FormData(f);
    busy($("button", f), async () => { await api(`/interviews/${f.dataset.fb}/feedback`, { method: "POST", body: { rating: +d.get("rating"), notes: d.get("notes") } }); toast("Thanks, feedback saved"); render(); }); });
}

render();
</script>
</body>
</html>
