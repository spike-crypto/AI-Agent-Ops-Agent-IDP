<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e5e57'/%3E%3Cpath d='M11 11V9.5A1.5 1.5 0 0 1 12.5 8h7A1.5 1.5 0 0 1 21 9.5V11M8 11h16v12H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .page { max-width: 880px; margin: 0 auto; padding: 28px 20px 64px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
  .hero { margin-bottom: 28px; }
  .hero p { margin-top: 8px; max-width: 60ch; color: var(--ink-2); }
  .jobs { display: grid; gap: 12px; }
  .job {
    display: flex; align-items: center; gap: 16px; padding: 18px 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m);
  }
  .job-main { flex: 1; min-width: 0; }
  .job-main h3 { margin-bottom: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 13px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta .lucide { width: 15px; height: 15px; }
  .empty {
    padding: 32px; text-align: center; color: var(--ink-2);
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-m);
  }
  dialog {
    width: min(560px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line);
    border-radius: var(--radius-m); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-pop);
  }
  dialog::backdrop { background: rgba(20, 32, 29, .45); }
  .form { display: grid; gap: 14px; margin-top: 16px; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 600; font-size: 13px; }
  .field input, .field textarea {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--surface-2); color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-s);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
    text-decoration: none; font-weight: 600;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-s); font-size: 14px; }
  .msg.ok { background: var(--done-soft); color: var(--done); }
  .msg.err { background: var(--bad-soft); color: var(--bad); }
  .foot { margin-top: 40px; font-size: 13px; color: var(--ink-3); }
  @media (max-width: 560px) { .job { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="brand" style="padding:0">
      <span class="brand-mark" data-icon="briefcase-business"></span>
      <span>
        <span class="brand-name" id="company">Careers</span>
        <span class="brand-sub">Open roles</span>
      </span>
    </div>
    <a class="btn" href="/" aria-label="Team sign in">Staff sign in</a>
  </header>

  <section class="hero">
    <h1 id="hero-title">Work with us</h1>
    <p id="hero-sub">Browse our open roles and apply in one step. No account needed.</p>
  </section>

  <section id="jobs" class="jobs" aria-live="polite">
    <div class="empty">Loading open roles&hellip;</div>
  </section>

  <p class="foot">Applications are reviewed by the hiring team. We never ask for payment or financial details.</p>
</main>

<dialog id="apply-dialog" aria-labelledby="apply-title">
  <h2 id="apply-title">Apply</h2>
  <p class="muted small" id="apply-for"></p>
  <form class="form" id="apply-form">
    <input type="hidden" id="job-id">
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name" required maxlength="200">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
    </div>
    <div class="field">
      <label for="resume">Resume (.pdf, .txt or .md, up to 2 MB)</label>
      <input id="resume" name="resume" type="file" accept=".pdf,.txt,.md" required>
    </div>
    <div class="field">
      <label for="note">Anything we should know? (optional)</label>
      <textarea id="note" name="note" maxlength="2000"></textarea>
    </div>
    <div class="msg hidden" id="apply-msg" role="status"></div>
    <div class="actions">
      <button type="button" class="btn" id="cancel-apply">Cancel</button>
      <button type="submit" class="btn primary" id="submit-apply">Send application</button>
    </div>
  </form>
</dialog>

<script src="/static/vendor/lucide.min.js"></script>
<script>
(() => {
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));

  const icons = () => window.lucide && window.lucide.createIcons({ attrs: { "stroke-width": 1.9 } });

  function iconTag(name) { return `<i data-lucide="${name}" class="lucide"></i>`; }

  function renderJobs(jobs) {
    const box = $("#jobs");
    if (!jobs.length) {
      box.innerHTML = `<div class="empty">There are no open roles right now. Check back soon.</div>`;
      icons();
      return;
    }
    box.innerHTML = jobs.map((j) => `
      <article class="job">
        <div class="job-main">
          <h3>${esc(j.title)}</h3>
          <div class="meta">
            ${j.department ? `<span>${iconTag("building-2")}${esc(j.department)}</span>` : ""}
            ${j.location ? `<span>${iconTag("map-pin")}${esc(j.location)}</span>` : ""}
          </div>
          <p class="muted small" style="margin-top:8px">${esc((j.description || "").slice(0, 220))}${(j.description || "").length > 220 ? "…" : ""}</p>
        </div>
        <button class="btn primary" data-apply="${j.id}" data-title="${esc(j.title)}">${iconTag("send")}Apply</button>
      </article>`).join("");
    icons();
  }

  async function load() {
    try {
      const cfg = await (await fetch("/public/config")).json();
      if (cfg.company_name) {
        $("#company").textContent = cfg.company_name;
        document.title = `Careers · ${cfg.company_name}`;
        $("#hero-title").textContent = `Work at ${cfg.company_name}`;
      }
      const jobs = await (await fetch("/public/jobs")).json();
      renderJobs(Array.isArray(jobs) ? jobs : []);
    } catch {
      $("#jobs").innerHTML = `<div class="empty">We could not load the open roles. Please refresh.</div>`;
    }
  }

  function showMessage(kind, text) {
    const box = $("#apply-msg");
    box.className = `msg ${kind}`;
    box.textContent = text;
    box.classList.remove("hidden");
  }

  function openApply(jobId, title) {
    $("#apply-form").reset();
    $("#job-id").value = jobId;
    $("#apply-for").textContent = `Applying for ${title}`;
    $("#apply-msg").className = "msg hidden";
    $("#submit-apply").disabled = false;
    $("#apply-dialog").showModal();
    $("#name").focus();
  }

  $("#cancel-apply").addEventListener("click", () => $("#apply-dialog").close());

  document.addEventListener("click", (event) => {
    const btn = event.target.closest("[data-apply]");
    if (btn) openApply(btn.dataset.apply, btn.dataset.title || "this role");
  });

  $("#apply-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const jobId = $("#job-id").value;
    const form = new FormData();
    form.append("name", $("#name").value.trim());
    form.append("email", $("#email").value.trim());
    form.append("note", $("#note").value.trim());
    const file = $("#resume").files[0];
    if (file) form.append("resume", file);

    const submit = $("#submit-apply");
    submit.disabled = true;
    try {
      const res = await fetch(`/public/jobs/${jobId}/apply`, { method: "POST", body: form });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        showMessage("ok", data.message || "Thanks — your application was received.");
        submit.textContent = "Sent";
      } else {
        showMessage("err", data.detail || "We could not submit that application.");
        submit.disabled = false;
      }
    } catch {
      showMessage("err", "Network problem — please try again.");
      submit.disabled = false;
    }
  });

  icons();
  load();
})();
</script>
</body>
</html>
