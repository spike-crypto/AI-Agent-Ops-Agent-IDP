# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Secret values (sync: false) are asked for once, when you create the Blueprint.
services:
  - type: web
    name: hiring-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # GitHub Actions deploys after tests pass. Render must not deploy on its own,
    # or every merge deploys twice.
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: COMPANY_NAME
        value: Hiring Desk
      - key: LOG_JSON
        value: "true"
      # Managed Postgres (Supabase) supplied in the Render dashboard. Render's free
      # database expired after 30 days and crashed three deploys; the blueprint must not
      # create one. sync: false means a Blueprint sync never overwrites the live URL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: HR Admin
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3.5-lightning:free
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_CAPTURE_CONTENT
        value: "true"
